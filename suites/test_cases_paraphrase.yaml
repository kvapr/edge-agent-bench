# Paraphrase-robustness test cases for the network-management tool-calling benchmark
# Derived from test_cases.yaml: 65 source cases x 3 paraphrase styles = 195 cases
# Each case preserves the exact expected_tool / expected_command / expected_params of its base_input
#   style A = casual (contractions, everyday verbs)
#   style B = verbose (polite, full sentences)
#   style C = indirect / intent-first (states the situation, not the literal command)

