level4_multi_param:
  - input: "@poesw1 set poe power limit to 25W on port 5"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_power_limit"
    expected_params: {"port": "1/5", "power_limit": 25}

  - input: "@poesw1 assign port 2 to vlan 10"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/2", "vlan_id": 10}

  - input: "@poesw1 set port 6 description Front Door Camera"
    expected_tool: "configure_device_setting"
    expected_command: "set_port_description"
    expected_params: {"port": "1/6", "description": "Front Door Camera"}

  - input: "@poesw1 configure vlan 20 on port 3"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/3", "vlan_id": 20}

  - input: "@poesw1 set poe limit 30 watts port 7"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_power_limit"
    expected_params: {"port": "1/7", "power_limit": 30}

  - input: "@poesw1 set port 4 description Server Room Switch"
    expected_tool: "configure_device_setting"
    expected_command: "set_port_description"
    expected_params: {"port": "1/4", "description": "Server Room Switch"}

  - input: "@poesw1 put port 9 in vlan 100"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/9", "vlan_id": 100}

  - input: "@poesw1 configure poe power 15W port 1"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_power_limit"
    expected_params: {"port": "1/1", "power_limit": 15}

  - input: "@poesw1 assign port 8 vlan 50"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/8", "vlan_id": 50}

  - input: "@poesw1 set port 10 description Lobby Access Point"
    expected_tool: "configure_device_setting"
    expected_command: "set_port_description"
    expected_params: {"port": "1/10", "description": "Lobby Access Point"}

  - input: "@poesw1 set poe power limit 20 on port 11"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_power_limit"
    expected_params: {"port": "1/11", "power_limit": 20}

  - input: "@poesw1 configure port 12 vlan 200"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/12", "vlan_id": 200}

  - input: "@poesw1 set port 5 description Conference Room TV"
    expected_tool: "configure_device_setting"
    expected_command: "set_port_description"
    expected_params: {"port": "1/5", "description": "Conference Room TV"}

  - input: "@poesw1 assign interface 2 to vlan 30"
    expected_tool: "configure_device_setting"
    expected_command: "configure_access_vlan"
    expected_params: {"port": "1/2", "vlan_id": 30}

  - input: "@poesw1 configure poe limit 25 watts on port 6"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_power_limit"
    expected_params: {"port": "1/6", "power_limit": 25}

