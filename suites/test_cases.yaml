level2_enable_disable:
  - input: "@poesw1 enable port 3"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/3"}

  - input: "@poesw1 disable port 7"
    expected_tool: "configure_device_setting"
    expected_command: "disable_port"
    expected_params: {"port": "1/7"}

  - input: "@poesw1 enable poe on port 4"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_mode"
    expected_params: {"port": "1/4", "mode": "enable"}

  - input: "@poesw1 disable poe on port 2"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_mode"
    expected_params: {"port": "1/2", "mode": "disable"}

  - input: "@poesw1 turn on port 6"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/6"}

  - input: "@poesw1 turn off port 9"
    expected_tool: "configure_device_setting"
    expected_command: "disable_port"
    expected_params: {"port": "1/9"}

  - input: "@poesw1 activate interface 1"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/1"}

  - input: "@poesw1 deactivate interface 5"
    expected_tool: "configure_device_setting"
    expected_command: "disable_port"
    expected_params: {"port": "1/5"}

  - input: "@poesw1 enable port 8"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/8"}

  - input: "@poesw1 disable port 10"
    expected_tool: "configure_device_setting"
    expected_command: "disable_port"
    expected_params: {"port": "1/10"}

  - input: "@poesw1 enable poe port 12"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_mode"
    expected_params: {"port": "1/12", "mode": "enable"}

  - input: "@poesw1 disable poe port 11"
    expected_tool: "configure_device_setting"
    expected_command: "configure_poe_mode"
    expected_params: {"port": "1/11", "mode": "disable"}

  - input: "@poesw1 turn on interface 3"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/3"}

  - input: "@poesw1 turn off interface 4"
    expected_tool: "configure_device_setting"
    expected_command: "disable_port"
    expected_params: {"port": "1/4"}

  - input: "@poesw1 activate port 2"
    expected_tool: "configure_device_setting"
    expected_command: "enable_port"
    expected_params: {"port": "1/2"}

